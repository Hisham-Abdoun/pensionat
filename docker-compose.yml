version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: booking-mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: booking_service
    volumes:
      - booking-mysql-data:/var/lib/mysql
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 10s
      timeout: 5s
      retries: 5

  booking-service:
    build: .
    container_name: booking-service
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://booking-mysql:3306/booking_service
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: rootpassword
      CUSTOMER_SERVICE_URL: http://kundtjanst-service:8081
    depends_on:
      mysql:
        condition: service_healthy
    restart: on-failure
    networks:
      - app-network

volumes:
  booking-mysql-data:

networks:
  app-network:
    external: true