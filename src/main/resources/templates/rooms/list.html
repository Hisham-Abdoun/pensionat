<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Rum / الغرف</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-4">

    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <h1>Rum / الغرف</h1>
    <a href="/customers" class="btn btn-secondary">Kunder</a>
    <a href="/bookings" class="btn btn-secondary">Bokningar</a>
    <hr>

    <table class="table table-bordered">
        <thead class="table-dark">
        <tr>
            <th>Rumsnummer</th>
            <th>Typ</th>
            <th>Extra sängar</th>
            <th>Pris/natt</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="room : ${rooms}">
            <td th:text="${room.roomNumber}"></td>
            <td th:text="${room.roomType}"></td>
            <td th:text="${room.extraBeds}"></td>
            <td th:text="${room.pricePerNight} + ' kr'"></td>
        </tr>
        </tbody>
    </table>

    <h3>Lägg till rum / إضافة غرفة</h3>
    <form th:action="@{/rooms/save}" th:object="${roomDto}" method="post">
        <div class="mb-2">
            <label>Rumsnummer / رقم الغرفة</label>
            <input type="number" th:field="*{roomNumber}" class="form-control">
            <span th:if="${#fields.hasErrors('roomNumber')}"
                  th:errors="*{roomNumber}" class="text-danger"></span>
        </div>
        <div class="mb-2">
            <label>Rumstyp / نوع الغرفة</label>
            <select th:field="*{roomType}" class="form-control">
                <option th:each="type : ${roomTypes}"
                        th:value="${type}"
                        th:text="${type}"></option>
            </select>
            <span th:if="${#fields.hasErrors('roomType')}"
                  th:errors="*{roomType}" class="text-danger"></span>
        </div>
        <div class="mb-2">
            <label>Extra sängar / أسرّة إضافية</label>
            <input type="number" th:field="*{extraBeds}"
                   class="form-control" min="0" max="2">
            <span th:if="${#fields.hasErrors('extraBeds')}"
                  th:errors="*{extraBeds}" class="text-danger"></span>
        </div>
        <div class="mb-2">
            <label>Pris per natt / السعر لليلة</label>
            <input type="number" th:field="*{pricePerNight}" class="form-control">
            <span th:if="${#fields.hasErrors('pricePerNight')}"
                  th:errors="*{pricePerNight}" class="text-danger"></span>
        </div>
        <button type="submit" class="btn btn-success">Spara</button>
    </form>
</div>
</body>
</html>
