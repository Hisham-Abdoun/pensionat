<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Pensionat</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-5 text-center">
    <h1 class="mb-4">Välkommen till Pensionat</h1>
    <p class="lead mb-5">Hantera bokningar, kunder och rum</p>

    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <span th:text="${error}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
        <span th:text="${success}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <div class="row justify-content-center">
        <div class="col-md-4 mb-3">
            <div class="card">
                <div class="card-body">
                    <h3 class="card-title">Bokningar</h3>
                    <p class="card-text">Se och hantera bokningar</p>
                    <a href="/bookings" class="btn btn-primary">Gå till bokningar</a>
                </div>
            </div>
        </div>

        <div class="col-md-4 mb-3">
            <div class="card">
                <div class="card-body">
                    <h3 class="card-title">Kunder</h3>
                    <p class="card-text">Se kunder från Kundtjänst (read-only)</p>
                    <a href="/customers" class="btn btn-primary">Gå till kunder</a>
                </div>
            </div>
        </div>

        <div class="col-md-4 mb-3">
            <div class="card">
                <div class="card-body">
                    <h3 class="card-title">Rum</h3>
                    <p class="card-text">Se och hantera rum</p>
                    <a href="/rooms" class="btn btn-primary">Gå till rum</a>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
