<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Pensionat / الضيافة</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-5 text-center">
    <h1 class="mb-4">Välkommen till Pensionat / أهلاً بك في الضيافة</h1>
    <p class="lead mb-5">Hantera bokningar, kunder och rum</p>
    
    <div class="row justify-content-center">
        <div class="col-md-4 mb-3">
            <div class="card">
                <div class="card-body">
                    <h3 class="card-title">Bokningar / الحجوزات</h3>
                    <p class="card-text">Se och hantera bokningar</p>
                    <a href="/bookings" class="btn btn-primary">Gå till bokningar</a>
                </div>
            </div>
        </div>
        
        <div class="col-md-4 mb-3">
            <div class="card">
                <div class="card-body">
                    <h3 class="card-title">Kunder / العملاء</h3>
                    <p class="card-text">Se och hantera kunder</p>
                    <a href="/customers" class="btn btn-primary">Gå till kunder</a>
                </div>
            </div>
        </div>
        
        <div class="col-md-4 mb-3">
            <div class="card">
                <div class="card-body">
                    <h3 class="card-title">Rum / الغرف</h3>
                    <p class="card-text">Se och hantera rum</p>
                    <a href="/rooms" class="btn btn-primary">Gå till rum</a>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
