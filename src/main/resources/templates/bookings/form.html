<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Redigera bokning / تعديل حجز</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-4">

    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <h1>Redigera bokning / تعديل حجز</h1>
    <a href="/bookings" class="btn btn-secondary">Tillbaka / رجوع</a>
    <hr>

    <form th:action="@{/bookings/update/{id}(id=${bookingDto.id})}"
          th:object="${bookingDto}" method="post">
        <div class="mb-2">
            <label>Kund / العميل</label>
            <select th:field="*{customerId}" class="form-control">
                <option th:each="customer : ${customers}"
                        th:value="${customer.id}"
                        th:text="${customer.firstName} + ' ' + ${customer.lastName}">
                </option>
            </select>
        </div>
        <div class="mb-2">
            <label>Rum / الغرفة</label>
            <select th:field="*{roomId}" class="form-control">
                <option th:each="room : ${rooms}"
                        th:value="${room.id}"
                        th:text="'Rum ' + ${room.roomNumber} + ' - ' + ${room.roomType}">
                </option>
            </select>
        </div>
        <div class="mb-2">
            <label>Startdatum / تاريخ البداية</label>
            <input type="date" th:field="*{startDate}" class="form-control">
            <span th:if="${#fields.hasErrors('startDate')}"
                  th:errors="*{startDate}" class="text-danger"></span>
        </div>
        <div class="mb-2">
            <label>Slutdatum / تاريخ النهاية</label>
            <input type="date" th:field="*{endDate}" class="form-control">
            <span th:if="${#fields.hasErrors('endDate')}"
                  th:errors="*{endDate}" class="text-danger"></span>
            <span th:if="${#fields.hasErrors('dateRangeValid')}"
                  th:errors="*{dateRangeValid}" class="text-danger"></span>
        </div>
        <div class="mb-2">
            <label>Antal gäster / عدد الضيوف</label>
            <input type="number" th:field="*{numberOfGuests}"
                   class="form-control" min="1">
            <span th:if="${#fields.hasErrors('numberOfGuests')}"
                  th:errors="*{numberOfGuests}" class="text-danger"></span>
        </div>
        <button type="submit" class="btn btn-success">Spara / حفظ</button>
        <a href="/bookings" class="btn btn-secondary">Avbryt / إلغاء</a>
    </form>
</div>
</body>
</html>
