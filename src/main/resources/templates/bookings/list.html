<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Bokningar / الحجوزات</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-4">

    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <h1>Bokningar / الحجوزات</h1>
    <a href="/customers" class="btn btn-secondary">Kunder</a>
    <a href="/rooms" class="btn btn-secondary">Rum</a>
    <a href="/bookings/search" class="btn btn-primary">Sök rum / بحث</a>
    <hr>

    <table class="table table-bordered">
        <thead class="table-dark">
        <tr>
            <th>Kund</th>
            <th>Rum</th>
            <th>Startdatum</th>
            <th>Slutdatum</th>
            <th>Gäster</th>
            <th>Åtgärder</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="booking : ${bookings}">
            <td th:text="${booking.customerName}"></td>
            <td th:text="${booking.roomNumber}"></td>
            <td th:text="${booking.startDate}"></td>
            <td th:text="${booking.endDate}"></td>
            <td th:text="${booking.numberOfGuests}"></td>
            <td>
                <a th:href="@{/bookings/edit/{id}(id=${booking.id})}"
                   class="btn btn-warning btn-sm">Redigera</a>
                <a th:href="@{/bookings/delete/{id}(id=${booking.id})}"
                   class="btn btn-danger btn-sm"
                   onclick="return confirm('Är du säker?')">Avboka</a>
            </td>
        </tr>
        </tbody>
    </table>

    <h3>Ny bokning / حجز جديد</h3>
    <form th:action="@{/bookings/save}" th:object="${bookingDto}" method="post">
        <div class="mb-2">
            <label>Kund / العميل</label>
            <select th:field="*{customerId}" class="form-control">
                <option value="">-- Välj kund --</option>
                <option th:each="customer : ${customers}"
                        th:value="${customer.id}"
                        th:text="${customer.firstName} + ' ' + ${customer.lastName}">
                </option>
            </select>
            <span th:if="${#fields.hasErrors('customerId')}"
                  th:errors="*{customerId}" class="text-danger"></span>
        </div>
        <div class="mb-2">
            <label>Rum / الغرفة</label>
            <select th:field="*{roomId}" class="form-control">
                <option value="">-- Välj rum --</option>
                <option th:each="room : ${rooms}"
                        th:value="${room.id}"
                        th:text="'Rum ' + ${room.roomNumber} + ' - ' + ${room.roomType}">
                </option>
            </select>
            <span th:if="${#fields.hasErrors('roomId')}"
                  th:errors="*{roomId}" class="text-danger"></span>
        </div>
        <div class="mb-2">
            <label>Startdatum / تاريخ البداية</label>
            <input type="date" th:field="*{startDate}" class="form-control">
            <span th:if="${#fields.hasErrors('startDate')}"
                  th:errors="*{startDate}" class="text-danger"></span>
        </div>
        <div class="mb-2">
            <label>Slutdatum / تاريخ النهاية</label>
            <input type="date" th:field="*{endDate}" class="form-control">
            <span th:if="${#fields.hasErrors('endDate')}"
                  th:errors="*{endDate}" class="text-danger"></span>
        </div>
        <div class="mb-2">
            <label>Antal gäster / عدد الضيوف</label>
            <input type="number" th:field="*{numberOfGuests}"
                   class="form-control" min="1">
            <span th:if="${#fields.hasErrors('numberOfGuests')}"
                  th:errors="*{numberOfGuests}" class="text-danger"></span>
        </div>
        <button type="submit" class="btn btn-success">Boka / احجز</button>
    </form>
</div>
</body>
</html>
