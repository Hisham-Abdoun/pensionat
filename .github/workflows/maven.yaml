name: CI

on:
  push:
    branches: [ main, martin ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Bygg with Maven
        run: mvn clean package

      - name: Run tests
        run: mvn test